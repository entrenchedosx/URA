[workspace]
resolver = "2"
members = ["crates/ura-core", "crates/ura-project", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
object = { version = "0.37", features = ["read", "std"] }
iced-x86 = "1.21"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
