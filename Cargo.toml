[workspace]
resolver = "2"
members = [
    "crates/ura-debugger",
    "crates/ura-core",
    "crates/ura-project",
    "crates/ura-native",
    "crates/ura-service",
    "crates/ura-cli",
    "crates/ura-mcp",
    "crates/ura-extensions",
    "src-tauri",
]
default-members = ["crates/ura-native"]

[workspace.package]
version = "0.16.0-dev"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
object = { version = "0.37", features = ["read", "std"] }
iced-x86 = "1.21"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
rmcp = { version = "3.6", features = ["server", "transport-io", "macros"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

capstone = { version = "=0.14.0", default-features = false, features = ["std", "full", "arch_arm64", "arch_arm", "arch_riscv"] }

z3 = { version = "=0.21.1", features = ["vendored"] }

# Z3's Debug C++ configuration opens .z3-trace before main(). Use its
# non-tracing Release configuration in developer/test binaries as well.
[profile.dev.package.z3-sys]
opt-level = 1
debug = 0

[profile.test.package.z3-sys]
opt-level = 1
debug = 0
